name: check

on:
  push:
    branches: [main]
    tags: ['v*'] # 发版 tag 也触发：重冒烟已从本地 check 挪到 CI（2026-08-26）
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 每天 UTC 21:00（北京 05:00）

jobs:
  static-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dsh CLI + pnpm
        run: npm i -g @deepseek-ai/dsh pnpm
      - name: Source sync + syntax gates
        run: |
          python3 scripts/gen-static.py --check
          node --check src/index.js
          node --check src/client/index.js
      - name: Offline unit tests (mock shell, no network)
        run: |
          node qa/unit.mjs
          node qa/cookie.mjs
          node qa/edge.mjs
          node qa/regress-v1228.mjs
          node qa/persist-upgrade.mjs
          node qa/state-paths.mjs
          node qa/vol-units.mjs
          node qa/fence.mjs
          node qa/client-pure.mjs
          node qa/cache.mjs
          node qa/client-bundle.mjs
      - name: Static install smoke (real user path)
        run: bash scripts/static-smoke.sh
        env:
          SMOKE_PORT: 3199
          # P0-C→1.25.0 修订：CI 数据关卡统一 warn——GitHub 数据中心出口 IP 恒被雪球
          # 边缘拦截（2026-10-23 tag strict 三连实证 [seed_blocked]），strict 数据关在
          # CI 不可达成；结构关卡（安装/启动/清单/bundle/栅栏）仍全数 FAIL。
          # 真实数据验证回归发版人本地：npm run check（strict）。
          SMOKE_LIVE: warn

  # 雪球真实接口契约：无 XQ_COOKIE secret 时自动 skip（push/PR 安全）
  # 每日定时用 secret Cookie 真跑，雪球改接口时这里最先失败（防 watch.json 类事故）
  live-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Contract test (cloud watchlist endpoints)
        run: node qa/contract.mjs
        env:
          XQ_COOKIE: ${{ secrets.XQ_COOKIE }}
      - name: Live API test (51 assertions)
        run: node qa/live.mjs

  # Windows 支持：DSH win32 层 shell 为 PowerShell。curl.exe 显式调用绕开 PS 5.1 的
  # Invoke-WebRequest 别名；离线套件每次 PR 全量跑，live.mjs（pwsh 真连雪球含匿名
  # Cookie 播种链路）只在每日定时/手动触发——匿名通道被出口 IP 拦截与插件好坏无关。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Source sync + syntax gates
        run: |
          python scripts/gen-static.py --check
          node --check src/index.js
          node --check src/client/index.js
      - name: Offline unit tests (mock shell, no network)
        run: |
          node qa/unit.mjs
          node qa/cookie.mjs
          node qa/edge.mjs
          node qa/regress-v1228.mjs
          node qa/persist-upgrade.mjs
          node qa/state-paths.mjs
          node qa/vol-units.mjs
          node qa/fence.mjs
          node qa/client-pure.mjs
          node qa/cache.mjs
          node qa/client-bundle.mjs
      - name: Live API test via pwsh shell (real Xueqiu, anonymous)
        # P0-C：真连雪球的 live 步骤只在每日定时/手动触发跑——PR 上匿名通道被出口 IP
        # 风控拦截时会掩盖真正的结构性回归；离线套件（上方）每次 PR 仍全量跑
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node qa/live.mjs
      # 真 Win10 老用户环境：DSH win32 层在无 pwsh 7 时回退 powershell.exe(5.1)。
      # XQ_FORCE_PS51=1 强制测试桩走同款回退 + UTF-8 编码声明（5.1 OEM 代码页防中文乱码）。
      - name: Live API test via Windows PowerShell 5.1 fallback (real Xueqiu)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node qa/live.mjs
        env:
          XQ_FORCE_PS51: '1'

  # 浏览器 E2E：合成引导的隔离 DSH 实例 + agent-browser(Playwright Chromium headless)
  # 覆盖：徽章挂载/拖拽/调宽/面板四 tab/越屏钳制——2025-08-24 这层抓到过"钳制死代码"真 bug，
  # 此前只在本机手动跑。browser-interact.sh 已带全新实例兜底（自动点开侧边栏会话）。
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # agent-browser 在 CI 慢环境可能挂死（本地同版本 3 分钟）——快速失败优于占用 6h
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dsh CLI + pnpm + agent-browser
        # agent-browser 锁定 0.27.0（本地验证可用的版本）：新版可能改变 open 的默认
        # 等待策略（如 network-idle——dsh web 有常驻连接永不 idle，会精确复现
        # "本地过、CI 挂"），升版本需先在本地对 0.2.x dsh 全流程彩排
        run: npm i -g @deepseek-ai/dsh pnpm agent-browser@0.27.0
      - name: Install Chromium for agent-browser
        run: npx playwright install chromium --with-deps
      - name: Boot synthetic DSH instance + run browser E2E
        run: |
          # boot 产物走 env 文件而非 stdout 捕获：eval/$() 会吞掉 boot 全部输出，
          # boot 挂起时步骤零输出且永远等待（runs 6-9 结构性根因）。现：
          # bash -x 全程 trace（挂死时日志停在最后一条命令）+ timeout 300 硬保底
          # + 产物写 $DSH_HOME_DIR/e2e-env.sh 供 source。
          timeout 300 bash -x scripts/e2e-ci-boot.sh 2>&1 | tee "${RUNNER_TEMP:-/tmp}/xq-boot-trace.log"
          ENV_FILE="${DSH_HOME_DIR:-/tmp/xq-e2e-home}/e2e-env.sh"
          [ -f "$ENV_FILE" ] || { echo "❌ boot 未产出 env 文件（trace 见上）"; exit 1; }
          source "$ENV_FILE"
          BASE_URL="${BASE_URL:-http://127.0.0.1:3210}" E2E_TOKEN="${E2E_TOKEN:-}" bash scripts/browser-interact.sh
        env:
          DSH_HOME_DIR: /tmp/xq-e2e-home
          WORKSPACE_DIR: /tmp/xq-e2e-home/ws
          E2E_PLUGIN_DIR: ${{ github.workspace }}
          E2E_PORT: '3210'

  # 播种链路纵向观测（P0-A 遗留项的证据采集）：每日从 GitHub 出口 IP 跑探针，
  # 记录候选 URL × 头组合的 set-cookie 返回。探针恒 exit 0（信息性，不做门禁）——
  # 数据用于 seedUrls 扩容决策（2026-10-22 本机网络全候选被拦，无法本地取证）。
  seed-probe:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Seed endpoint probe (informational, always exit 0)
        run: node qa/probe-seed.mjs
